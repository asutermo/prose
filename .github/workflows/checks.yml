name: checks

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checker regression tests
        run: python -m unittest discover -s tests -v
      - name: Secrets and private-content scan
        run: python scripts/check_prose.py
      - name: Skill style lint (heuristic; protected literals may trip it)
        run: python scripts/ste_check.py SKILL.md || true
